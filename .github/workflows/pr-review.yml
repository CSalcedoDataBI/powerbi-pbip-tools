# Review automática de PRs con @claude (motor PRINCIPAL — suscripción Max)
# Copiar a:  .github/workflows/pr-review.yml
# Requiere el secret del repo:  CLAUDE_CODE_OAUTH_TOKEN
#   (generar una vez con:  claude setup-token  — usa tu cupo Max, se reinicia cada mes)
# Guía completa:  docs/ci-cd/free-pr-review.md   (en el repo fb-command-center)
#
# OJO con el "fallback gratis" de esa guía (pr-review.workflow.yml, NVIDIA NIM):
# medido el 2026-08-28, sus DOS modelos ya no están en el catálogo de NIM
# (meta/llama-3.1-70b-instruct y nvidia/llama-3.3-nemotron-super-49b-v1).
# Desplegarlo tal cual falla en cada PR. Ver la issue #23 para los reemplazos
# medidos y por qué ninguno sirve todavía como motor de review.
name: PR Review (@claude)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Un push nuevo a la misma PR cancela la review anterior: solo la ultima sirve.
# github.ref vale refs/pull/<n>/merge, asi que agrupa por PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # No revisa borradores (ahorra cupo Max), y no corre en PRs de forks: GitHub
    # no expone secrets a un fork, asi que el token llegaria vacio y el check
    # saldria rojo en la PR de quien contribuye, sin decir nada del codigo.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # El default de GitHub son 360 min: un job colgado se come el 12% de la cuota mensual.
    timeout-minutes: 15
    # A nivel de job, no de workflow: si manana se anade otro job, no hereda el OIDC.
    permissions:
      pull-requests: write
      # track_progress crea un comentario de seguimiento; en GitHub un comentario de
      # PR es un comentario de issue, asi que necesita este scope ademas del anterior.
      issues: write
      contents: read
      # claude-code-action pide un token OIDC a GitHub para autenticarse; sin este
      # permiso falla con "Could not fetch an OIDC token" antes de leer el diff.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sin esto la action corre el prompt entero y NO publica nada: medido en
          # el run 33142445041, 14 turnos y $0.24 cuyo resultado murio en el log.
          track_progress: true
          prompt: |
            Revisa este pull request como un senior engineer. Enfócate en:
            - Bugs y errores de lógica
            - Seguridad (secrets expuestos, inyección, validación de entrada)
            - Buenas prácticas y mantenibilidad
            - Cobertura de tests faltante
            Responde en español, con feedback accionable y concreto. Sé breve;
            si el PR está bien, dilo en una línea en vez de inventar problemas.
