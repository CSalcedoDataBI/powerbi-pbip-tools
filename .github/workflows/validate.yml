# Validacion mecanica de los scripts PowerShell del repo.
# Determinista y gratis: no consume cupo de ningun LLM.
#   1. PSScriptAnalyzer sobre skills/, tests/ y tools/ (version fijada)
#   2. Smoke test de detect-colors + recolor contra una copia de examples/Demo
#   3. Tests de tokens de color sobre un fixture sintetico (RGBA, #RGB, rgb(), BOM)
#   4. Tests de Inline-ChartJs: el aviso MIT viaja en cada dashboard convertido
name: Validate scripts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Solo cuando cambia algo que estas comprobaciones puedan romper.
    # No hay check requerido en este repo, asi que una PR que no toque estas
    # rutas simplemente no dispara el workflow y no se queda colgada esperandolo.
    paths:
      - 'skills/**/*.ps1'
      - 'skills/**/*.psm1'
      - 'tools/**/*.ps1'
      - 'tests/**'
      - 'examples/Demo/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PSSA_VERSION: '1.25.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v6
        with:
          path: ~/.local/share/powershell/Modules
          key: psscriptanalyzer-${{ runner.os }}-${{ env.PSSA_VERSION }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Pinned on purpose. The lint fails on Warning, so an unpinned analyzer
          # could add a rule overnight and redden a PR that changed nothing.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq $env:PSSA_VERSION)) {
            Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Scope CurrentUser -Force -AllowClobber
          }
          Write-Output "PSScriptAnalyzer $env:PSSA_VERSION"

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          # tests/ is linted too: the harness can carry the same class of bug it exists to catch.
          # tools/ ships PowerShell too (Inline-ChartJs.ps1), so it is held to the same bar.
          # PSSA 1.25.0 has thrown "Object reference not set to an instance of an
          # object" mid-analysis - seen three times locally and not reproducible on
          # demand afterwards (0/25 per file, 0/10 on this exact command). A crash is
          # the tool failing to run, not a finding, so it is retried rather than
          # reported: what must never be retried away is a real finding, and those
          # come back identically on the next attempt. Three tries, then let it fail.
          $results = $null
          foreach ($try in 1..3) {
            try {
              $results = @('skills','tests','tools') | ForEach-Object {
                Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -ErrorAction Stop
              }
              break
            } catch {
              Write-Output "::warning::PSScriptAnalyzer crasheo (intento $try/3): $($_.Exception.Message)"
              if ($try -eq 3) { throw }
            }
          }
          $blocking = @($results | Where-Object { $_.Severity -in 'Error','Warning' })
          $advisory  = @($results | Where-Object { $_.Severity -eq 'Information' })
          if ($advisory) {
            Write-Output "Information (no bloquea): $($advisory.Count)"
            $advisory | Format-Table RuleName, ScriptName, Line -AutoSize
          }
          if ($blocking) {
            $blocking | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
            # Warnings fallan a proposito: el bug que motivo este workflow
            # (PSAvoidAssignmentToAutomaticVariable) es severidad Warning, asi que
            # fallar solo en Error dejaria pasar exactamente lo que vino a atrapar.
            Write-Output "::error::PSScriptAnalyzer: $($blocking.Count) hallazgo(s) bloqueante(s)."
            exit 1
          }
          Write-Output "PSScriptAnalyzer: sin hallazgos bloqueantes."

      - name: Smoke test (detect-colors + recolor)
        shell: pwsh
        run: ./tests/smoke-test.ps1

      - name: Color-token tests
        shell: pwsh
        run: ./tests/color-tokens-test.ps1

      - name: Inline-ChartJs tests
        shell: pwsh
        run: ./tests/inline-chartjs-test.ps1
